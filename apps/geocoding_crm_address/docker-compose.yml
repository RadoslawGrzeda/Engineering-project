services:
  geocoding_crm_address:
    build:
      context: ..
      dockerfile: geocoding_crm_address/Dockerfile
    container_name: geocoding_crm_address
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
    command: python -m apps.geocoding_crm_address.consumer
    networks:
      - traefik_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_network:
    external: true
