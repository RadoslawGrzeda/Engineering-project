services:
    broker1:
      image: apache/kafka:latest
      container_name: broker1
      restart: always
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://broker1:9094
        KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
        KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
        KAFKA_LISTENERS: ${KAFKA_LISTENERS}
        KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
        KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
        KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS}
        KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}
        KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
      networks:
        - traefik_network
      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 30s
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

    broker2:
      image: apache/kafka:latest
      container_name: broker2
      restart: always
      ports:
        - "9095:9092"
      environment:
        KAFKA_NODE_ID: 2
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095,DOCKER://broker2:9094
        KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
        KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
        KAFKA_LISTENERS: ${KAFKA_LISTENERS}
        KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
        KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
        KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS}
        KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}
        KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
      networks:
        - traefik_network
      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 30s
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

    broker3:
      image: apache/kafka:latest
      container_name: broker3
      restart: always
      ports:
        - "9096:9092"
      environment:
        KAFKA_NODE_ID: 3
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9096,DOCKER://broker3:9094
        KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
        KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
        KAFKA_LISTENERS: ${KAFKA_LISTENERS}
        KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
        KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
        KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS}
        KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}
        KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
      networks:
        - traefik_network
      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 30s
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

    redpanda-console:
      image: redpandadata/console:latest
      container_name: redpanda-console
      restart: always
      ports:
        - "8085:8080"
      environment:
        KAFKA_BROKERS: "broker1:9094,broker2:9094,broker3:9094"
      networks:
        - traefik_network
      depends_on:
        - broker1
        - broker2
        - broker3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_network"
        - "traefik.http.routers.redpanda.rule=Host(`redpanda.radoslawgrzeda.com`)"
        - "traefik.http.routers.redpanda.entrypoints=websecure"
        - "traefik.http.routers.redpanda.tls=true"
        - "traefik.http.routers.redpanda.tls.certresolver=mytlschallenge"
        - "traefik.http.routers.redpanda.service=redpanda-svc"
        - "traefik.http.services.redpanda-svc.loadbalancer.server.port=8080"
        - "traefik.http.routers.redpanda.middlewares=keycloak-auth@docker"
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

networks:
  traefik_network:
    external: true
