services:

  minio-backup:
    image: minio/minio:latest
    container_name: minio-backup
    restart: always
    networks:
      - traefik_network
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_backup_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_BACKUP_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_BACKUP_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"

      - "traefik.http.routers.minio-backup-api.rule=Host(`minio-backup-api.radoslawgrzeda.com`)"
      - "traefik.http.routers.minio-backup-api.entrypoints=websecure"
      - "traefik.http.routers.minio-backup-api.tls=true"
      - "traefik.http.routers.minio-backup-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.minio-backup-api.service=minio-backup-api-svc"
      - "traefik.http.services.minio-backup-api-svc.loadbalancer.server.port=9000"

      - "traefik.http.routers.minio-backup-console.rule=Host(`minio-backup-ui.radoslawgrzeda.com`)"
      - "traefik.http.routers.minio-backup-console.entrypoints=websecure"
      - "traefik.http.routers.minio-backup-console.tls=true"
      - "traefik.http.routers.minio-backup-console.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.minio-backup-console.service=minio-backup-console-svc"
      - "traefik.http.services.minio-backup-console-svc.loadbalancer.server.port=9001"
      

  mc-mirror:
    image: minio/mc:latest
    container_name: mc-mirror
    restart: always
    networks:
      - traefik_network
    depends_on:
      - minio-backup
    environment:
      PRIMARY_ENDPOINT: http://minio:9000
      PRIMARY_ACCESS_KEY: ${MINIO_PRIMARY_USER}
      PRIMARY_SECRET_KEY: ${MINIO_PRIMARY_PASSWORD}
      BACKUP_ENDPOINT: http://minio-backup:9000
      BACKUP_ACCESS_KEY: ${MINIO_BACKUP_USER}
      BACKUP_SECRET_KEY: ${MINIO_BACKUP_PASSWORD}
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for MinIO instances to be ready...';
      until mc alias set primary $$PRIMARY_ENDPOINT $$PRIMARY_ACCESS_KEY $$PRIMARY_SECRET_KEY 2>/dev/null; do
        sleep 3;
      done;
      until mc alias set backup $$BACKUP_ENDPOINT $$BACKUP_ACCESS_KEY $$BACKUP_SECRET_KEY 2>/dev/null; do
        sleep 3;
      done;
      echo 'Both MinIO instances ready.';

      echo 'Setting lifecycle policy (expire after 30 days) on backup buckets...';
      for bucket in $$(mc ls primary/ --json | grep -o '\"key\":\"[^\"]*\"' | cut -d'\"' -f4); do
        mc mb --ignore-existing backup/$$bucket;
        mc ilm rule add backup/$$bucket --expire-days 30;
        echo \"Lifecycle set for backup/$$bucket\";
      done;

      echo 'Starting continuous mirror...';
      mc mirror --watch --overwrite primary/ backup/
      "

networks:
  traefik_network:
    external: true

volumes:
  minio_backup_data:
