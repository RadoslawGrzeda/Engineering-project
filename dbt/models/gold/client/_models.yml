version: 2

models:
  - name: gold_client_dim_customer
    description: "SCD2 — historia zmian danych klienta (dane osobowe, języki, narodowości)."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null

  - name: gold_client_dim_address
    description: "SCD2 — historia zmian adresów klienta per typ adresu."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null
      - name: address_type
        description: "Typ adresu."
        tests:
          - not_null

  - name: gold_client_dim_contact
    description: "SCD2 — historia zmian danych kontaktowych klienta per typ i wartość kontaktu."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null
      - name: contact_type
        description: "Typ kontaktu (email, telefon itp.)."
        tests:
          - not_null
      - name: contact_value
        description: "Wartość kontaktu."
        tests:
          - not_null

  - name: gold_client_dim_digital_access
    description: "SCD2 — historia zmian dostępu do portalu klienta."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null

  - name: gold_client_fct_loyalty
    description: "SCD2 — historia zmian statusu programu lojalnościowego."
    columns:
      - name: identifier_id
        description: "Identyfikator karty lojalnościowej."
        tests:
          - not_null

  - name: gold_client_fct_indicator
    description: "SCD2 — historia zmian wskaźników klienta per typ wskaźnika."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null
      - name: indicator_type
        description: "Typ wskaźnika."
        tests:
          - not_null

  - name: gold_client_fct_subscription
    description: "SCD2 — historia zmian subskrypcji komunikacyjnych klienta."
    columns:
      - name: person_id
        description: "Identyfikator klienta."
        tests:
          - not_null
      - name: communication_code
        description: "Kod kanału komunikacji."
        tests:
          - not_null
