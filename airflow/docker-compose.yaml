services:
  airflow-init:
    image: apache/airflow:2.10.4
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    depends_on:
      airflow-db:
        condition: service_healthy
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true"
    networks:
      - traefik_network

  airflow-webserver:
    image: apache/airflow:2.10.4
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Warsaw
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - PYTHONPATH=/opt/airflow:/opt/airflow/apps/load_file_develop
      - _PIP_ADDITIONAL_REQUIREMENTS=python-json-logger pydantic sqlalchemy psycopg2-binary pandas minio python-dotenv structlog apache-airflow-providers-docker clickhouse-connect
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./config:/opt/airflow/config
      - ../apps:/opt/airflow/apps
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    command: bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - traefik_network

  airflow-scheduler:
    image: apache/airflow:2.10.4
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Warsaw
      - PYTHONPATH=/opt/airflow:/opt/airflow/apps/load_file_develop
      - _PIP_ADDITIONAL_REQUIREMENTS=python-json-logger pydantic sqlalchemy psycopg2-binary pandas minio python-dotenv structlog apache-airflow-providers-docker clickhouse-connect
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./config:/opt/airflow/config
      - ../apps:/opt/airflow/apps
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
    command: airflow scheduler
    networks:
      - traefik_network

  airflow-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 5
    networks:
      - traefik_network

volumes:
  airflow_db_data:
  airflow_logs:

networks:
  traefik_network:
    external: true
